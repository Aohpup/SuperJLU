[project]
name = "jlu-toolkit"
version = "0.1.0"
description = "吉大课表/成绩本地工具：导入文件、计算绩点、导出 iCal，并提供 MCP 接口给 AI 助手"
requires-python = ">=3.9"
dependencies = []
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
[project.scripts]
jlu-toolkit = "jlu_toolkit.cli:main"
jlu-toolkit-mcp = "jlu_toolkit.mcp_server:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
