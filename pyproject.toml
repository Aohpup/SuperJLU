[project]
name = "jlu-toolkit"
version = "0.3.20"
description = "吉大课表/成绩本地工具：导入文件或从教务 HTTP 拉取、计算绩点、导出 iCal，并提供 MCP 接口"
requires-python = ">=3.9"
dependencies = []
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
captcha = ["pillow>=9.0"]
ocr = ["pillow>=9.0", "ddddocr"]
[project.scripts]
jlu-toolkit = "jlu_toolkit.cli:main"
jlu-toolkit-mcp = "jlu_toolkit.mcp_server:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jlu_toolkit*"]

[tool.setuptools.package-data]
jlu_toolkit = ["data/*", "data/demo/*"]
