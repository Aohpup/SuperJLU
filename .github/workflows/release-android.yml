name: Release Android apk

# 推送 v* 标签：构建 release apk → apksigner 签名 → SHA256 → 上传到同名 GitHub Release
#（与 release-windows.yml 共用一个 Release，谁先到谁创建，另一个追加上传）。
# 手动运行（workflow_dispatch）：默认构建未签名 debug apk；勾选 signed 则构建签名 release apk。均只作为产物上传。
# Gradle 约定见 docs/android-release.md。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signed:
        description: "构建签名的 release apk（产物，不发 Release）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.signed == true }}
    outputs:
      built: ${{ steps.check.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - name: Check android/ project
        id: check
        run: |
          if [ -x android/gradlew ] || [ -f android/gradlew ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::仓库里还没有 android/ Gradle 项目（缺 android/gradlew），跳过 Android 构建。"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.check.outputs.built == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK platform 35（使用 runner 预装 SDK）
        if: steps.check.outputs.built == 'true'
        run: |
          sm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sm" --licenses >/dev/null || true
          "$sm" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-python@v5   # Chaquopy 的 buildPython
        if: steps.check.outputs.built == 'true'
        with:
          python-version: "3.13"
      - name: Version
        if: steps.check.outputs.built == 'true'
        run: |
          test -f jlu_toolkit/__init__.py
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('jlu_toolkit/__init__.py').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
          fi
          echo "JLU_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "JLU_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build debug (manual run)
        if: steps.check.outputs.built == 'true' && env.SIGNED != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/jlu-toolkit-debug.apk
          (cd ../dist && sha256sum jlu-toolkit-debug.apk > jlu-toolkit-debug.apk.sha256 && cat *.sha256)
      - name: Build release (unsigned)
        if: steps.check.outputs.built == 'true' && env.SIGNED == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign
        if: steps.check.outputs.built == 'true' && env.SIGNED == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64" || { echo "缺少 ANDROID_KEYSTORE_B64 secret"; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          in=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -1)
          ks="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p dist
          "$bt/zipalign" -f -p 4 "$in" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/jlu-toolkit.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs dist/jlu-toolkit.apk | grep -i "SHA-256"
          rm -f "$ks"
          (cd dist && sha256sum jlu-toolkit.apk > jlu-toolkit.apk.sha256 && cat jlu-toolkit.apk.sha256)
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.built == 'true'
        with:
          name: jlu-toolkit-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.built == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jlu-toolkit-android
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/jlu-toolkit.apk dist/jlu-toolkit.apk.sha256"
          for i in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" $files -R "$GITHUB_REPOSITORY" --clobber && exit 0
            elif gh release create "$GITHUB_REF_NAME" $files -R "$GITHUB_REPOSITORY" \
                   --title "$GITHUB_REF_NAME" --generate-notes; then
              exit 0
            fi
            echo "重试 $i（可能与 Windows 发布并发创建）"; sleep 20
          done
          exit 1
