name: CI
on:
  push:
    branches: [main, "feat/**", "refactor/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -U pip && pip install -e . pytest
      - name: pytest (includes node UI tree tests)
        run: python -m pytest -q
      - name: UI script syntax (node --check)
        run: |
          python -c "import re;from jlu_toolkit.ui_page import PAGE;open('page.js','w',encoding='utf-8').write(re.search(r'<script>(.*)</script>',PAGE,re.S).group(1))"
          node --check page.js
